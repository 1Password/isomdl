[package]
name = "isomdl"
version = "0.1.0"
edition = "2021"
description = "ISO mDL implementation in Rust"
readme = "README.md"
homepage = "https://github.com/spruceid/isomdl"
repository = "https://github.com/spruceid/isomdl"
documentation = "https://docs.rs/isomdl"
license = "Apache-2.0 OR MIT"
exclude = ["test/"]

[[bin]]
name = "isomdl-utils"
path = "src/bin/utils.rs"
required_features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:clap-stdin", ]

[dependencies]
anyhow = "1.0"
ecdsa = { version = "0.16", features = ["serde", "verifying"] }
p256 = { version = "0.13", features = ["serde", "ecdh"] }
p384 = { version = "0.13", features = ["serde", "ecdh"] }
rand = { version = "0.8", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "1"
elliptic-curve = "0.13"
hkdf = "0.12"
hex-literal = "0.3"
aes-gcm = "0.10"
hmac = "0.12"
aes = "0.8"
sec1 = "0.7"
uuid = { version = "1.3", features = ["v1", "v4", "std", "rng", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
zeroize = { version = "1.5", features = ["zeroize_derive"] }
signature = { version = "2", features = ["std"] }
async-signature = "0.3"
#tracing = "0.1"
base64 = "0.13"
pem-rfc7468 = "0.7"
x509-cert = { version = "0.2", features = ["pem", "builder"] }
ssi-jwk = { git = "https://github.com/1Password/ssi.git", rev = "fb0b29cca3982081b9e7654587c93aa95839c2dd", default-features = false, features = ["secp256k1", "secp256r1", "ed25519"] }
isomdl-macros = { version = "0.1", path = "macros" }
clap = { version = "4", features = ["derive"], optional = true }
clap-stdin = { version = "0.2", optional = true }
const-oid = "0.9"
der = { version = "0.7", features = ["std", "derive", "alloc"] }
hex = "0.4"
asn1-rs = { version = "0.5", features = ["bits"] }

strum = "0.24"
strum_macros = "0.24"

coset = "0.3"
ciborium = "0.2"
digest = "0.10"
log = "0.4"
sha1 = "0.10"

[dev-dependencies]
hex = "0.4.3"
p256 = "0.13.0"
rstest = "0.23.0"
serde_json = "*"
test-log = { version = "0.2.16", features = ["trace"] }
x509-cert = { version = "0.2.4", features = ["pem", "builder", "hazmat"] }
